# Unit tests plus the NAT simulation on every push and pull request.
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make unit
      - run: make
      - run: sudo apt-get install -y nftables
      # The runners block unprivileged user namespaces, so the network
      # simulation runs as root (natsim.sh skips the user namespace then).
      - run: sudo -E env "PATH=$PATH" NATSIM_DEBUG=1 make natsim NATSIM_MODES=cone roam
